<template>
    <div class="guide-container">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <!-- Progress Indicator -->
            <div class="progress-section">
                <div class="custom-progress-path">
                    <template for:each={stepsWithStatus} for:item="step">
                        <button type="button" key={step.value} class={step.className} data-index={step.index}
                            onclick={handleStepClick} aria-label={step.label}>
                            <span class="step-marker">{step.number}</span>
                            <span class="step-label">{step.label}</span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Step Content -->
            <div class="content-section">
                <!-- Welcome -->
                <template if:true={isWelcome}>
                    <div class="step-content welcome-step">
                        <div class="hero-section">
                            <p class="hero-tagline">Innovate fast, deploy securely, and protect your data.</p>
                        </div>
                        <div class="platform-intro">
                            <p>Welcome to your free trial! Get hands-on access to Salesforce development and
                                security tools to build, customize, and deploy powerful agents and applications.</p>
                            <p>Salesforce's built-in agent and application lifecycle management and governance tools
                                help you build with confidence. Leverage the full power of Salesforce data and metadata;
                                automate intelligent workflows; generate UI experiences with your preferred AI tools; manage
                                deployments securely; and keep your org, data, and agents secure with enterprise-grade
                                visibility.</p>
                            <p class="trial-highlight">With this free trial, you get hands-on access to &nbsp;
                                <strong>Setup with Agentforce</strong>, <strong>Agentforce Builder</strong>, <strong>Agentforce Testing Center</strong>, <strong>Metadata Deployment</strong>, <strong>Protect Your Data</strong>, and a fully functional custom AI application – giving you everything you need to innovate fast, deploy securely, and protect your data on Salesforce.

                            </p>
                            <p class="trial-highlight">Before you begin, you'll need to set up a <strong>Full Copy Sandbox</strong> as your development environment. All build activities in this guide — including Agentforce Builder, Testing, and Bring your own AI — should be completed inside the sandbox. When you're ready to go live, you'll deploy your changes from the sandbox back to your production org in the <strong>Deploy Securely</strong> section. Follow the detailed sandbox setup instructions at the beginning of the <strong>Agentforce Builder</strong> step.</p>
                            <div class="react-setup-notice">
                                <p class="react-setup-notice-title">⚙️ Want to explore React apps in this org? Enable the following settings first:</p>
                                <ol class="react-setup-steps">
                                    <li>
                                        <strong>Enable Salesforce Multi-Framework</strong><br/>
                                        Go to: <em>Setup → React Development with Salesforce Multi-Framework (Beta)</em><br/>
                                        Turn on: <strong>Salesforce Multi-Framework → Enable Beta</strong>
                                    </li>
                                    <li>
                                        <strong>Enable Digital Experiences</strong><br/>
                                        Go to: <em>Setup → Digital Experiences → Settings</em><br/>
                                        Turn on: <strong>Enable Digital Experiences</strong>
                                    </li>
                                    <li>
                                        <strong>Enable Salesforce CMS MCP access</strong><br/>
                                        Go to: <em>Setup → Digital Experiences → Salesforce CMS</em><br/>
                                        Turn on: <strong>Access the Content Read-Only MCP Server and Tools (Beta)</strong>
                                    </li>
                                    <li>
                                        <strong>Preview your React app in real-time</strong><br/>
                                        Download the <a href="https://marketplace.visualstudio.com/items?itemName=salesforce.salesforcedx-vscode-ui-preview" target="_blank" rel="noopener noreferrer">Salesforce UI Preview VS Code extension</a> to preview your React app directly in VS Code.
                                    </li>
                                </ol>
                            </div>
                        </div>

                        <div class="image-usecase-row">
                            <div class="use-case-section">
                                <div class="use-case-header">
                                    <span class="use-case-icon">🎓</span>
                                    <h2>Use Case: Connected Executive Education</h2>
                                </div>
                                <div class="use-case-content">
                                    <p>Connected Executive Education (or CEE for short) is a fictitious company that
                                        delivers executive training courses to individuals and businesses around the
                                        world. CEE uses headless capabilities to streamline and modernize their
                                        executive learning programs with intelligent agents and apps.</p>
                                    <p>CEE built this custom application on Salesforce to manage courses, instructors,
                                        students, and enrollments. Agentforce helps them automate their operations,
                                        personalize and scale learner engagement, and unlock real-time insights.</p>
                                    <p>When you're ready, move on to the next stage of your free trial by clicking the
                                        buttons below, or at the top of the screen.</p>
                                </div>
                            </div>
                            <div class="hero-image-container">
                                <img src={trialHeroImage} alt="Headless 360 platform" class="hero-image" />
                            </div>
                        </div>

                        <h3 class="section-title">What You Can Do Inside the Trial</h3>
                        <div class="feature-cards">
                            <div class="feature-card clickable" data-step="1" onclick={handleCardClick}>
                                <lightning-icon icon-name="standard:apps" size="medium"></lightning-icon>
                                <h3>Setup with Agentforce</h3>
                                <p>A ready-to-use Learning Management AI app built entirely on Salesforce.</p>
                                <span class="card-link">Explore →</span>
                            </div>
                            <div class="feature-card clickable" data-step="2" onclick={handleCardClick}>
                                <lightning-icon icon-name="standard:bot" size="medium"></lightning-icon>
                                <h3>Agentforce Builder</h3>
                                <p>Configure your Agentforce. Set up agent actions and automate workflows.</p>
                                <span class="card-link">Configure →</span>
                            </div>
                            <div class="feature-card clickable" data-step="3" onclick={handleCardClick}>
                                <lightning-icon icon-name="standard:case" size="medium"></lightning-icon>
                                <h3>Test Agentforce</h3>
                                <p>Ensure Agentforce is ready to go live by testing it thoroughly with built-in tools.</p>
                                <span class="card-link">Test →</span>
                            </div>
                            <div class="feature-card clickable" data-step="4" onclick={handleCardClick}>
                                <lightning-icon icon-name="standard:connected_apps" size="medium"></lightning-icon>
                                <h3>Bring Your Own AI Tools</h3>
                                <p>Use your preferred AI assistant to build on Salesforce.</p>
                                <span class="card-link">Connect →</span>
                            </div>
                            <div class="feature-card clickable" data-step="5" onclick={handleCardClick}>
                                <lightning-icon icon-name="utility:upload" size="medium"></lightning-icon>
                                <h3>Deploy Securely</h3>
                                <p>Deploy seamlessly with built-in metadata tools.</p>
                                <span class="card-link">Deploy →</span>
                            </div>
                            <div class="feature-card clickable" data-step="6" onclick={handleCardClick}>
                                <lightning-icon icon-name="standard:insights" size="medium"></lightning-icon>
                                <h3>Protect Your Data</h3>
                                <p>Get comprehensive security for critical data, across your apps and agents.</p>
                                <span class="card-link">Monitor →</span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Step 1: Inspect App -->
                <template if:true={isStep1}>
                    <div class="step-content">
                        <div class="back-link" onclick={handleBackToWelcome}>
                            <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                            <span>Back to Guide Home</span>
                        </div>
                        <div class="step-header">
                            <lightning-icon icon-name="standard:apps" size="large" class="step-icon"></lightning-icon>
                            <div class="step-header-text">
                                <h2>Explore App Configuration with Setup with Agentforce</h2>
                                <p class="step-description">Explore the components behind Connected Executive Education's custom AI application using Setup with Agentforce.</p>
                                <p class="step-meta"><em>Estimated time to complete</em>: 5 minutes</p>
                            </div>
                        </div>

                        <div class="instruction-panel">
                            <div class="intro-section">
                                <p>The Learning Management App is a fully configured custom AI application that CEE built on Salesforce using headless capabilities. Before you start building your own agents, take a moment to understand how this application is structured behind the scenes.</p>
                                <p>Instead of manually exploring object tabs one by one in the UI, you'll use <strong>Setup with Agentforce</strong> to quickly explore the app's configuration layer. Setup with Agentforce can help you understand data models, relationships, customizations, fields, and permission sets across Salesforce objects – all through natural-language questions. Then you'll take a quick look at the app's tabs to see how that setup updates in the app experience.</p>
                                <p>In this step, you'll use Setup with Agentforce to understand the core setup behind the Learning Management App, including its custom objects, relationships, fields, and access controls. Once you understand how the app is structured, you'll also see how that app updates in the app experience.</p>
                            </div>

                            <!-- Step 1: Enable Setup with Agentforce -->
                            <div class="config-section">
                                <div class="config-header">
                                    <span class="config-number">1</span>
                                    <h3>Enable Setup with Agentforce</h3>
                                </div>

                                <h4>Enable Data Cloud</h4>
                                <p class="indented-step">Click the <strong>Setup gear icon</strong> in the top right</p>
                                <p class="indented-step">In the <strong>Quick Find</strong> box, search for <strong>"Data Cloud Setup"</strong></p>
                                <p class="indented-step">Click <strong>Get Started</strong> to enable <strong>Data Cloud</strong></p>

                                <h4>Enable Einstein</h4>
                                <p class="indented-step">In the <strong>Quick Find</strong> box, search for <strong>"Einstein Setup"</strong></p>
                                <p class="indented-step">Toggle <strong>Einstein</strong> <span class="status-on">ON</span></p>

                                <h4>Enable Agentforce</h4>
                                <p class="indented-step">In the <strong>Quick Find</strong> box, search for <strong>"Agentforce Agents"</strong></p>
                                <p class="indented-step">Toggle <strong>Agentforce Agents</strong> <span class="status-on">ON</span></p>

                                <h4>Assign the Data Cloud User permission set</h4>
                                <p class="indented-step">In the <strong>Quick Find</strong> box, search for <strong>"Permission Sets"</strong></p>
                                <p class="indented-step">Open <strong>Data Cloud User</strong>, click <strong>Manage Assignments</strong> &rarr; <strong>Add Assignment</strong>, select your user, and click <strong>Assign</strong></p>

                                <h4>Enable Setup with Agentforce</h4>
                                <p class="indented-step">In the <strong>Quick Find</strong> box, search for <strong>"Setup with Agentforce"</strong></p>
                                <p class="indented-step">Toggle <strong>Agent Availability</strong> <span class="status-on">ON</span></p>
                                <div class="section-screenshot">
                                    <img src={enables4aImage} alt="Setup with Agentforce settings page" class="screenshot-image" />
                                </div>
                            </div>

                            <!-- Step 2: Ask Setup with Agentforce to explain the app configuration -->
                            <div class="config-section">
                                <div class="config-header">
                                    <span class="config-number">2</span>
                                    <h3>Ask Setup with Agentforce to explain the app configuration</h3>
                                </div>
                                <p>Navigate to <strong>Setup with Agentforce</strong> by selecting the <strong>Home</strong> tab.</p>
                                <div class="section-screenshot">
                                    <img src={setupwithagentforceImage} alt="Setup Home page with Setup with Agentforce" class="screenshot-image" />
                                </div>
                                <p>In Setup with Agentforce, enter the following prompt:</p>
                                <div class="prompt-copy-box">
                                    <div class="prompt-copy-row">
                                        <span>💬</span>
                                        <span class="copy-code-text">Help me understand my org</span>
                                        <button type="button" class="copy-code-btn" onclick={handleCopyCode} aria-label="Copy prompt">
                                            <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                            <span class="copy-code-label">Copy</span>
                                        </button>
                                    </div>
                                </div>
                                <p>Review the response from Setup with Agentforce to understand your org's overall health, including security scores, license usage, storage utilization, and any critical issues that need attention.</p>
                                <div class="section-screenshot">
                                    <img src={s4aHealthImage} alt="Setup with Agentforce org health response" class="screenshot-image" />
                                </div>
                                <p>Next, enter the following prompt:</p>
                                <div class="prompt-copy-box">
                                    <div class="prompt-copy-row">
                                        <span>💬</span>
                                        <span class="copy-code-text">Help me understand objects, key relationships, important fields behind the Learning Management app.</span>
                                        <button type="button" class="copy-code-btn" onclick={handleCopyCode} aria-label="Copy prompt">
                                            <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                            <span class="copy-code-label">Copy</span>
                                        </button>
                                    </div>
                                </div>
                                <p>Review the response from Setup with Agentforce. It should help you understand:</p>
                                <ul class="numbered-steps">
                                    <li>The custom objects that support the Learning Management App</li>
                                    <li>How Courses, Students, and Enrollments relate to each other</li>
                                    <li>Which fields are important for tracking course details, learner profiles, enrollment status, and progress</li>
                                    <li>Which permission sets or access controls help determine who can view or manage this data</li>
                                </ul>
                                <div class="section-screenshot">
                                    <img src={s4aObjectsImage} alt="Setup with Agentforce Learning Management objects response" class="screenshot-image" />
                                </div>
                            </div>

                            <!-- Step 3: Review deep information -->
                            <div class="config-section">
                                <div class="config-header">
                                    <span class="config-number">2</span>
                                    <h3>Review deep information</h3>
                                </div>
                                <p>Next, use Setup with Agentforce to understand how access is controlled for this app.</p>
                                <p>Enter the following prompt:</p>
                                <div class="prompt-copy-box">
                                    <div class="prompt-copy-row">
                                        <span>💬</span>
                                        <span class="copy-code-text">Which permission set controls access to the Learning Management app and its Courses, Students, and Enrollments objects? Summarize what users with those permissions can do.</span>
                                        <button type="button" class="copy-code-btn" onclick={handleCopyCode} aria-label="Copy prompt">
                                            <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                            <span class="copy-code-label">Copy</span>
                                        </button>
                                    </div>
                                </div>
                                <p>Review the response and look for how Salesforce controls access to the app, objects, fields, and records. You'll see how access control is structured in the app so you understand who has access to what and what actions they can perform.</p>
                                <div class="section-screenshot">
                                    <img src={s4aDeepImage} alt="Setup with Agentforce permission set details response" class="screenshot-image" />
                                </div>
                            </div>

                            <!-- Step 4: Confirm what you learned in the app -->
                            <div class="config-section">
                                <div class="config-header">
                                    <span class="config-number">4</span>
                                    <h3>Confirm what you learned in the app</h3>
                                </div>
                                <p>Now return to the <strong>Learning Management App</strong> by searching and selecting it from the <strong>App Launcher</strong> (waffle icon). Briefly open the following tabs:</p>
                                <div class="tip-box">
                                    <span>💡</span>
                                    <span><strong>Tip:</strong> If you don't see any records when you open a tab, change the list view from <strong>Recently Viewed</strong> to <strong>All</strong> using the dropdown at the top of the page.</span>
                                </div>
                            </div>
                        </div>

                        <!-- Courses Section (for reference) -->
                        <div class="object-detail-section">
                            <div class="object-detail-header">
                                <lightning-icon icon-name="custom:custom24" size="medium"></lightning-icon>
                                <h3>Courses</h3>
                            </div>
                            <div class="object-detail-content">
                                <p>The <strong>Courses</strong> object stores all offerings available in CEE's executive
                                    education catalog. Each record includes essential details such as category, delivery
                                    format, duration, and instructor information.</p>
                                <p>When you open the Courses tab, you'll see a list of sample course records – like
                                    <em> Executive Leadership Fundamentals</em> and <em>Digital Transformation Strategy</em>. These records give you a realistic view of how a company like CEE might manage a dynamic course catalog inside Salesforce.</p>
                                <div class="section-screenshot">
                                    <img src={coursesImage} alt="Courses List View" class="screenshot-image" />
                                </div>
                                <div class="explore-list">
                                    <h4>Try exploring:</h4>
                                    <ul>
                                        <li>The course list view to browse available programs</li>
                                        <li>A course record to view its metadata and learning details</li>
                                        <li>How each course links to active enrollments</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- Students Section -->
                        <div class="object-detail-section">
                            <div class="object-detail-header">
                                <lightning-icon icon-name="standard:people" size="medium"></lightning-icon>
                                <h3>Students</h3>
                            </div>
                            <div class="object-detail-content">
                                <p>The <strong>Students</strong> object captures learner profiles for individuals
                                    enrolled in CEE's executive programs. Each profile includes the learner's name,
                                    role, organization, contact information, and enrollment status.</p>
                                <p>Opening a student record like <strong>Lisa Moore</strong> shows:</p>
                                <ul class="feature-list">
                                    <li>Student details such as company and job title</li>
                                    <li>Contact information used for communication and automated workflows</li>
                                    <li>Status indicators that reflect where the learner is in their journey</li>
                                </ul>
                                <div class="section-screenshot">
                                    <img src={studentsImage} alt="Students List View" class="screenshot-image" />
                                </div>
                                <p class="detail-note">This data model allows CEE to keep a centralized, up-to-date
                                    record of every participant.</p>
                            </div>
                        </div>

                        <!-- Enrollments Section -->
                        <div class="object-detail-section">
                            <div class="object-detail-header">
                                <lightning-icon icon-name="standard:task" size="medium"></lightning-icon>
                                <h3>Enrollments</h3>
                            </div>
                            <div class="object-detail-content">
                                <p>The <strong>Enrollments</strong> object connects students to their courses and tracks
                                    their progress. Each enrollment record includes the course name, the student
                                    assigned, start dates, and a live progress indicator.</p>
                                <p>The <strong>Course Enrollments Dashboard</strong> organizes these records for quick
                                    insight. You'll see:</p>
                                <ul class="feature-list">
                                    <li>A searchable list of all active enrollments</li>
                                    <li>Progress bars showing learner completion</li>
                                    <li>Course and student names linked directly to their records</li>
                                    <li>Enrollment creation dates to track timelines</li>
                                </ul>
                                <div class="section-screenshot">
                                    <img src={enrollmentsImage} alt="Enrollments Dashboard" class="screenshot-image" />
                                </div>
                                <p class="detail-note">This view helps CEE's coordinators and program managers monitor
                                    multiple cohorts at once.</p>
                            </div>
                        </div>

                        <!-- Wrap-Up -->
                        <div class="action-box highlight">
                            <div class="action-box-header">
                                <lightning-icon icon-name="utility:touch_action" size="small"></lightning-icon>
                                <h4>Wrap-Up</h4>
                            </div>
                            <p>Using Setup with Agentforce, you explored the app configuration behind the Learning Management app, including its custom objects, relationships, fields, and permission sets. You now understand how this app is structured behind the scenes.</p>
                            <p>Now that you understand the app's structure and access model, you're ready to customize the CEE Learning Agent in Agentforce Builder. Then you'll confirm how that app updates in the app experience.</p>
                        </div>
                    </div>
                </template>

                <!-- Step 2: Agentforce Builder -->
                <template if:true={isStep2}>
                    <div class="step-content">
                        <div class="back-link" onclick={handleBackToWelcome}>
                            <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                            <span>Back to Guide Home</span>
                        </div>
                        <div class="step-header">
                            <lightning-icon icon-name="standard:bot" size="large" class="step-icon"></lightning-icon>
                            <div class="step-header-text">
                                <h2>Agentforce Builder</h2>
                                <p class="step-description">Explore the pre-built Agent Script and add a custom action using the new Agentforce Builder.</p>
                                <p class="step-meta"><em>Estimated time to complete</em>: 5 minutes after sandbox creation</p>
                            </div>
                        </div>
                        <div class="instruction-panel">
                            <div class="intro-section">
                                <p>Agentforce helps you bring AI agents into your workflows and applications to improve productivity, with humans and agents working together. CEE wants to build and customize their Agentforce in order to help their team manage courses, students, and enrollments for thousands of learners.</p>
                                <p>The <strong>CEE Learning Agent</strong> has been pre-created for you using <strong>Agent Script</strong> — a powerful, code-control-friendly approach for building deterministic Agentforce agents. The agent's configuration, system instructions, Learning Management subagent, and two actions (Search Courses and Search Students) were defined in a single <strong style="color: #d04437;">.agent</strong> file and deployed as part of your org's metadata.</p>
                                <p>In this step, you'll open the agent in the new <strong>Agentforce Builder</strong>, walk through the Agent Script, add one more action, then deploy your updated Agent Script file back into your org.</p>
                            </div>

                            <!-- Set Up Your Development Environment -->
                            <div class="preconfig-notice">
                                <p style="margin-bottom: 1em;">
                                    <lightning-icon icon-name="standard:settings" size="small" style="vertical-align: middle; margin-right: 0.5rem;"></lightning-icon>
                                    <strong>Set Up Your Development Environment</strong>
                                </p>
                                <p>Before you begin building, you'll need to create a sandbox — a safe, isolated copy of your org where you can develop and test changes without affecting your live environment.</p>
                                <p>Follow these steps from <strong>this org</strong>:</p>
                                <ul class="numbered-steps">
                                    <li>Click the <strong>Setup gear icon</strong> in the top right corner of your screen</li>
                                    <li>Click <strong>Setup</strong> to open the Setup Home page</li>
                                    <li>In the <strong>Quick Find</strong> search box on the left, type <strong>"Sandboxes"</strong></li>
                                    <li>Click <strong>Sandboxes</strong> under the <strong>Environments</strong> section in the left sidebar</li>
                                    <li>On the Sandboxes page, click the <strong>New Sandbox</strong> button in the top right</li>
                                    <li>Enter a <strong>Name</strong> for your sandbox (e.g., "fullcopy") — this will be used in your sandbox login URL</li>
                                    <li>Optionally, add a <strong>Description</strong> (e.g., "Full Copy sandbox for trial")</li>
                                    <li>Under <strong>Sandbox License</strong>, select <strong>Full Copy</strong> to create a complete copy of this org including all data and configuration</li>
                                    <li>Click <strong>Next</strong></li>
                                    <li>On the Sandbox Options page, select <strong>All</strong> for Object Data Included. Keep the default settings and click <strong>Create</strong></li>
                                </ul>
                                <p class="preconfig-note"><strong>Note:</strong> Sandbox creation can take some time depending on the size of your org. You will receive an <strong>email notification</strong> when your sandbox is ready to use. The email will contain a link to activate and log in to your new sandbox.</p>
                                <p style="margin-top: 1.5em;"><strong>Logging into your sandbox:</strong></p>
                                <ul class="numbered-steps">
                                    <li>Click the activation link in the email you received, or go to <strong>test.salesforce.com</strong></li>
                                    <li>Your sandbox username is your username with the sandbox name appended (e.g., <strong>yourname@company.com.fullcopy</strong>)</li>
                                    <li>Use the same password as this org</li>
                                    <li>Once logged in, you'll see the sandbox indicator in the top header confirming you're in your development environment</li>
                                </ul>
                                <p>All build activities in the following steps — <strong>Agentforce Builder</strong>, <strong>Test Agentforce</strong>, and <strong>Bring Your Own AI Tools</strong> — should be completed inside this sandbox. When you're ready to promote your work to production, you'll do so in the <strong>Deploy Securely</strong> step.</p>
                            </div>

                            <!-- Step 1: Enable Einstein and Agentforce -->
                            <div class="config-section">
                                <div class="config-header">
                                    <span class="config-number">1</span>
                                    <h3>Enable Einstein and Agentforce</h3>
                                </div>
                                <p>Before working with the agent, enable Einstein and Agentforce in your org.</p>

                                <h4>Enable Einstein</h4>
                                <ul class="numbered-steps">
                                    <li>Click the <strong>Setup gear icon</strong> in the top right</li>
                                    <li>In the <strong>Quick Find</strong> box, search for <strong>"Einstein Setup"</strong></li>
                                    <li>Toggle <strong>Einstein</strong> <span class="status-on">ON</span></li>
                                </ul>

                                <h4>Enable Agentforce</h4>
                                <ul class="numbered-steps">
                                    <li>In the <strong>Quick Find</strong> box, search for <strong>"Agentforce Agents"</strong></li>
                                    <li>Toggle <strong>Agentforce Agents</strong> <span class="status-on">ON</span></li>
                                </ul>
                                <div class="section-screenshot">
                                    <img src={einsteinSetupImage} alt="Einstein Setup" class="screenshot-image" />
                                </div>
                            </div>

                            <!-- Step 2: Open the CEE Learning Agent in Agentforce Studio -->
                            <div class="config-section">
                                <div class="config-header">
                                    <span class="config-number">2</span>
                                    <h3>Open the CEE Learning Agent in Agentforce Studio</h3>
                                </div>
                                <p>The agent was created for you via Agent Script and deployed with the org metadata. Agentforce Builder, powered by the new Agent Script, is our redesigned, intuitive workspace that makes Agentforce easier to build, control, and trust. With natural-language creation, guided agentic assistance, and structured logic all working together, you can build and scale agents faster than ever.</p>
                                <p>Want to learn more about Agentforce, including agent topics and actions before continuing? Check out this <a href="https://trailhead.salesforce.com/content/learn/trails/get-started-with-agentforce" target="_blank" rel="noopener noreferrer">Trail</a>, on Trailhead.</p>

                                <p>Switch to <strong>Script View</strong> and walk through the key sections of the pre-built agent:</p>

                                        <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                        <span class="copy-code-label">Copy</span>
                                    </button>
                                </div>
                                <div class="copy-code-block">
                                    <code class="copy-code-text">claude mcp add --transport http sobject-reads https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-reads --callback-port 38000 --client-id "XXX" --client-secret</code>
                                    <button type="button" class="copy-code-btn" onclick={handleCopyCode} aria-label="Copy code">
                                        <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                        <span class="copy-code-label">Copy</span>
                                    </button>
                                </div>
                                <div class="copy-code-block">
                                    <code class="copy-code-text">claude mcp add --transport http salesforce-api-context https://api.salesforce.com/platform/mcp/v1/sandbox/platform/salesforce-api-context --callback-port 38000 --client-id "XXX" --client-secret</code>
                                    <button type="button" class="copy-code-btn" onclick={handleCopyCode} aria-label="Copy code">
                                        <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                        <span class="copy-code-label">Copy</span>
                                    </button>
                                </div>
                                <div class="copy-code-block">
                                    <code class="copy-code-text">claude mcp add --transport http metadata-experts https://api.salesforce.com/platform/mcp/v1/sandbox/platform/metadata-experts --callback-port 38000 --client-id "XXX" --client-secret</code>
                                    <button type="button" class="copy-code-btn" onclick={handleCopyCode} aria-label="Copy code">
                                        <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                                        <span class="copy-code-label">Copy</span>
                                    </button>
                                </div>
                                <p class="indented-step">When prompted to do so, paste the ECA consumer secret you've obtained previously.</p>
                            </li>

                            <li>
                                <strong>Start Claude Code</strong>

                                <p class="indented-step">Claude Code will launch in your terminal.</p>
                            </li>

                            <li>

                                <p class="indented-step">A browser window will open asking you to grant access. Log in with your Salesforce credentials and click <strong>Allow</strong>.</p>
                                <p class="indented-step">Once authenticated, Claude Code will show the server status as "connected."</p>
                                <p class="mcp-why"><em>Why MCP matters:</em> With the MCP server connected, Claude can read your Salesforce schema, query records, and understand your org's structure – making it much more effective at helping you build and modify Salesforce components.</p>
                            </li>
                        </ol>

            <!-- Navigation -->
            <div class="navigation-section">
                <template if:false={isWelcome}>
                    <button class="nav-btn nav-btn-neutral" onclick={handlePrevious}>
                        <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
                        <span>Previous</span>
                    </button>
                </template>
                <template if:true={isWelcome}>
                    <div></div>
                </template>
                <template if:false={isStep7}>
                    <button class="nav-btn nav-btn-brand" onclick={handleNext}>
                        <span>{nextButtonLabel}</span>
                    </button>
                </template>
                <template if:true={isStep7}>
                    <button class="nav-btn nav-btn-brand" onclick={handleRestart}>
                        <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                        <span>Start Over</span>
                    </button>
                </template>
            </div>
        </template>

        <!-- Provisioning Modal: single overlay to avoid white strip from SLDS layout -->
        <template if:true={showProvisioningModal}>
            <div class="provisioning-overlay" role="dialog" aria-modal="true" onclick={handleOverlayClick}>
                <div class="provisioning-dialog" role="document" onclick={stopPropagation}>
                    <div class="modal-content-wrapper">
                        <template if:true={provisioningPending}>
                            <lightning-spinner alternative-text="Requesting provisioning" size="medium"></lightning-spinner>
                            <h2 class="modal-title">Requesting provisioning…</h2>
                            <p class="modal-message">Contacting the provisioner. This may take a few seconds.</p>
                        </template>
                        <template if:false={provisioningPending}>
                            <template if:true={provisioningError}>
                                <lightning-icon icon-name="utility:error" size="large" class="modal-icon modal-icon-error"></lightning-icon>
                                <h2 class="modal-title">Provisioning Request Issue</h2>
                                <p class="modal-message modal-message-error">{provisioningError}</p>
                                <p class="modal-note">The provisioner may require a browser to complete setup. Open it in a new tab to create your target org and receive credentials by email.</p>
                                <button type="button" class="nav-btn nav-btn-brand modal-open-tab-btn" onclick={openProvisionerInNewTab}>
                                    <lightning-icon icon-name="utility:new_window" size="x-small"></lightning-icon>
                                    <span>Open provisioner in new tab</span>
                                </button>
                            </template>
                            <template if:false={provisioningError}>
                                <lightning-icon icon-name="utility:email" size="large" class="modal-icon"></lightning-icon>
                                <h2 class="modal-title">Your Org is Being Provisioned</h2>
                                <p class="modal-message">Your new target org is being created. You will receive the login credentials at your registered email address shortly.</p>
                                <p class="modal-note">This process typically takes 2-3 minutes.</p>
                            </template>
                        </template>
                        <button class="nav-btn nav-btn-brand modal-close-btn" onclick={closeProvisioningModal}>
                            <span>Got it</span>
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
